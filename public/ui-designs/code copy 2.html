<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Switch User - Design Board</title>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Unified Tailwind Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#5f5f5f",
              "primary-dim": "#535353",
              "primary-container": "#e4e2e2",
              "primary-fixed": "#e4e2e2",
              "primary-fixed-dim": "#d6d4d4",
              "on-primary": "#fbf8f8",
              "on-primary-container": "#525252",
              "on-primary-fixed": "#3f3f3f",
              "on-primary-fixed-variant": "#5c5b5b",
              "inverse-primary": "#ffffff",
              secondary: "#3b4ce0",
              "secondary-dim": "#2c3dd4",
              "secondary-container": "#dfe0ff",
              "secondary-fixed": "#dfe0ff",
              "secondary-fixed-dim": "#ced1ff",
              "on-secondary": "#fbf8ff",
              "on-secondary-container": "#2a3cd3",
              "on-secondary-fixed": "#0921c1",
              "on-secondary-fixed-variant": "#3647dc",
              tertiary: "#754c9e",
              "tertiary-dim": "#684091",
              "tertiary-container": "#d3a6ff",
              "tertiary-fixed": "#d3a6ff",
              "tertiary-fixed-dim": "#c598f1",
              "on-tertiary": "#fff6ff",
              "on-tertiary-container": "#4a2172",
              "on-tertiary-fixed": "#32025b",
              "on-tertiary-fixed-variant": "#532b7c",
              error: "#ac3434",
              "error-dim": "#70030f",
              "error-container": "#f56965",
              "on-error": "#fff7f6",
              "on-error-container": "#65000b",
              background: "#f9f9ff",
              "on-background": "#253349",
              surface: "#f9f9ff",
              "surface-dim": "#cadbfa",
              "surface-bright": "#f9f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f0f3ff",
              "surface-container": "#e7eeff",
              "surface-container-high": "#dee9ff",
              "surface-container-highest": "#d4e3ff",
              "surface-variant": "#d4e3ff",
              "on-surface": "#253349",
              "on-surface-variant": "#516077",
              "surface-tint": "#5f5f5f",
              outline: "#6d7b94",
              "outline-variant": "#a4b3cd",
              "inverse-surface": "#070e19",
              "inverse-on-surface": "#969dac",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              "2xl": "1rem",
              full: "0.75rem",
            },
            fontFamily: {
              headline: ["Inter"],
              body: ["Inter"],
              label: ["Inter"],
              display: ["Inter"],
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        font-size: 20px;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-zinc-50 to-zinc-100 dark:from-zinc-950 dark:to-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen overflow-hidden"
  >
    <!-- Modal Backdrop -->
    <div
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200"
    >
      <!-- Modal Container -->
      <div
        class="bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-hidden border border-zinc-200/50 dark:border-zinc-800/50 animate-in zoom-in-95 duration-200"
      >
        <!-- Modal Header -->
        <div
          class="bg-gradient-to-r from-white to-zinc-50 dark:from-zinc-900 dark:to-zinc-800 border-b border-zinc-200/50 dark:border-zinc-800/50 px-6 py-4 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 bg-gradient-to-br from-secondary to-secondary-dim rounded-xl flex items-center justify-center shadow-lg"
            >
              <span
                class="material-symbols-outlined text-white text-lg"
                data-icon="people"
                >people</span
              >
            </div>
            <div>
              <h1 class="text-lg font-bold text-zinc-900 dark:text-zinc-50">
                Switch User
              </h1>
              <p class="text-xs text-zinc-500 dark:text-zinc-400">
                Select or create a user
              </p>
            </div>
          </div>
          <button
            class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 p-2 rounded-lg transition-all active:scale-95"
          >
            <span class="material-symbols-outlined" data-icon="close"
              >close</span
            >
          </button>
        </div>

        <!-- Modal Content -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
          <!-- User List -->
          <section class="space-y-2 mb-6">
            <div
              class="flex items-center justify-between py-3 px-4 bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-200/50 dark:border-zinc-700/50 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:shadow-md transition-all duration-200 cursor-pointer group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 flex items-center justify-center bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg shadow-md"
                >
                  <span
                    class="material-symbols-outlined text-white text-lg"
                    data-icon="person"
                    >person</span
                  >
                </div>
                <div>
                  <span
                    class="font-semibold text-sm text-zinc-900 dark:text-zinc-100 block"
                    >Alexander Wright</span
                  >
                  <span class="text-xs text-zinc-500 dark:text-zinc-400"
                    >Last active 2h ago</span
                  >
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span
                  class="text-xs font-bold text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/20 px-2.5 py-0.5 rounded-full uppercase tracking-wider"
                  >Active</span
                >
                <span
                  class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-300 transition-colors"
                  >chevron_right</span
                >
              </div>
            </div>

            <div
              class="flex items-center justify-between py-3 px-4 bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-200/50 dark:border-zinc-700/50 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:shadow-md transition-all duration-200 cursor-pointer group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 flex items-center justify-center bg-gradient-to-br from-purple-400 to-purple-600 rounded-lg shadow-md"
                >
                  <span
                    class="material-symbols-outlined text-white text-lg"
                    data-icon="person"
                    >person</span
                  >
                </div>
                <div>
                  <span
                    class="font-semibold text-sm text-zinc-900 dark:text-zinc-100 block"
                    >Elena Rossi</span
                  >
                  <span class="text-xs text-zinc-500 dark:text-zinc-400"
                    >Last active 1d ago</span
                  >
                </div>
              </div>
              <span
                class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-300 transition-colors"
                >chevron_right</span
              >
            </div>

            <div
              class="flex items-center justify-between py-3 px-4 bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-200/50 dark:border-zinc-700/50 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:shadow-md transition-all duration-200 cursor-pointer group"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 flex items-center justify-center bg-gradient-to-br from-orange-400 to-orange-600 rounded-lg shadow-md"
                >
                  <span
                    class="material-symbols-outlined text-white text-lg"
                    data-icon="person"
                    >person</span
                  >
                </div>
                <div>
                  <span
                    class="font-semibold text-sm text-zinc-900 dark:text-zinc-100 block"
                    >Marcus Thorne</span
                  >
                  <span class="text-xs text-zinc-500 dark:text-zinc-400"
                    >Last active 3d ago</span
                  >
                </div>
              </div>
              <span
                class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600 dark:group-hover:text-zinc-300 transition-colors"
                >chevron_right</span
              >
            </div>
          </section>

          <!-- Create New User Section -->
          <section class="pt-6 border-t border-zinc-200 dark:border-zinc-700">
            <h2
              class="text-xs font-black uppercase tracking-[0.2em] mb-4 text-zinc-600 dark:text-zinc-400"
            >
              Create New User
            </h2>
            <form class="space-y-3">
              <div class="space-y-2">
                <label
                  class="block text-sm font-semibold text-zinc-700 dark:text-zinc-300"
                  for="username"
                >
                  User Name
                </label>
                <input
                  class="w-full bg-zinc-50 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg focus:ring-2 focus:ring-secondary/50 focus:border-secondary dark:focus:border-secondary text-sm py-2.5 px-4 placeholder:text-zinc-400 transition-all"
                  id="username"
                  name="username"
                  placeholder="Enter name..."
                  type="text"
                />
              </div>
              <button
                class="w-full bg-gradient-to-r from-zinc-900 to-zinc-800 dark:from-zinc-100 dark:to-zinc-200 text-zinc-50 dark:text-zinc-900 font-bold py-2.5 rounded-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200"
                type="submit"
              >
                Create User
              </button>
            </form>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
