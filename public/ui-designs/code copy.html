<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Design Board - Canvas Editor</title>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Unified Tailwind Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#5f5f5f",
              "primary-dim": "#535353",
              "primary-container": "#e4e2e2",
              "primary-fixed": "#e4e2e2",
              "primary-fixed-dim": "#d6d4d4",
              "on-primary": "#fbf8f8",
              "on-primary-container": "#525252",
              "on-primary-fixed": "#3f3f3f",
              "on-primary-fixed-variant": "#5c5b5b",
              "inverse-primary": "#ffffff",
              secondary: "#3b4ce0",
              "secondary-dim": "#2c3dd4",
              "secondary-container": "#dfe0ff",
              "secondary-fixed": "#dfe0ff",
              "secondary-fixed-dim": "#ced1ff",
              "on-secondary": "#fbf8ff",
              "on-secondary-container": "#2a3cd3",
              "on-secondary-fixed": "#0921c1",
              "on-secondary-fixed-variant": "#3647dc",
              tertiary: "#754c9e",
              "tertiary-dim": "#684091",
              "tertiary-container": "#d3a6ff",
              "tertiary-fixed": "#d3a6ff",
              "tertiary-fixed-dim": "#c598f1",
              "on-tertiary": "#fff6ff",
              "on-tertiary-container": "#4a2172",
              "on-tertiary-fixed": "#32025b",
              "on-tertiary-fixed-variant": "#532b7c",
              error: "#ac3434",
              "error-dim": "#70030f",
              "error-container": "#f56965",
              "on-error": "#fff7f6",
              "on-error-container": "#65000b",
              background: "#f9f9ff",
              "on-background": "#253349",
              surface: "#f9f9ff",
              "surface-dim": "#cadbfa",
              "surface-bright": "#f9f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f0f3ff",
              "surface-container": "#e7eeff",
              "surface-container-high": "#dee9ff",
              "surface-container-highest": "#d4e3ff",
              "surface-variant": "#d4e3ff",
              "on-surface": "#253349",
              "on-surface-variant": "#516077",
              "surface-tint": "#5f5f5f",
              outline: "#6d7b94",
              "outline-variant": "#a4b3cd",
              "inverse-surface": "#070e19",
              "inverse-on-surface": "#969dac",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              "2xl": "1rem",
              full: "0.75rem",
            },
            fontFamily: {
              headline: ["Inter"],
              body: ["Inter"],
              label: ["Inter"],
              display: ["Inter"],
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        font-size: 20px;
      }

      /* Dot Grid Background Utility */
      .dot-grid {
        background-image: radial-gradient(#d1d5db 0.8px, transparent 0.8px);
        background-size: 24px 24px;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-zinc-50 via-blue-50/30 to-purple-50/20 dark:from-zinc-950 dark:via-zinc-900 dark:to-zinc-950 text-on-surface overflow-hidden h-screen w-screen selection:bg-secondary/20"
  >
    <!-- TopAppBar: Simplified Design -->
    <header
      class="fixed top-0 w-full h-14 bg-white/60 dark:bg-zinc-950/60 backdrop-blur-2xl border-b border-zinc-200/30 dark:border-zinc-800/30 flex justify-between items-center px-6 z-50 shadow-sm"
    >
      <!-- Editable Board Name -->
      <div class="flex items-center gap-2">
        <input
          type="text"
          value="Untitled Board"
          class="bg-transparent border-none text-base font-semibold tracking-wide text-zinc-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-secondary/50 rounded px-2 py-1 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/50 transition-all cursor-text"
          placeholder="Board name..."
        />
        <button
          class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 p-1 rounded transition-colors"
        >
          <span class="material-symbols-outlined text-sm" data-icon="edit"
            >edit</span
          >
        </button>
      </div>

      <!-- Share Button -->
      <button
        class="flex items-center gap-2 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100/50 dark:hover:bg-zinc-800/50 transition-all px-3 py-1.5 rounded-lg active:scale-95 duration-200"
      >
        <span class="material-symbols-outlined text-base" data-icon="share"
          >share</span
        >
        <span class="text-sm font-medium">Share</span>
      </button>
    </header>
    <!-- Canvas Area -->
    <main class="relative w-full h-full pt-14 flex items-center justify-center">
      <div
        class="w-full h-full bg-white/40 dark:bg-zinc-900/40 dot-grid relative shadow-inner backdrop-blur-sm"
      >
        <!-- Canvas Interaction Handles (Visual Representation) -->
        <div
          class="absolute top-1/4 left-1/3 w-64 h-40 border-2 border-secondary/50 bg-secondary/10 rounded-lg group shadow-lg hover:shadow-xl transition-shadow"
        >
          <div
            class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-gradient-to-br from-secondary to-secondary-dim rounded-full hover:scale-150 transition-transform cursor-nw-resize shadow-md"
          ></div>
          <div
            class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-gradient-to-br from-secondary to-secondary-dim rounded-full hover:scale-150 transition-transform cursor-ne-resize shadow-md"
          ></div>
          <div
            class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-gradient-to-br from-secondary to-secondary-dim rounded-full hover:scale-150 transition-transform cursor-sw-resize shadow-md"
          ></div>
          <div
            class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-gradient-to-br from-secondary to-secondary-dim rounded-full hover:scale-150 transition-transform cursor-se-resize shadow-md"
          ></div>
        </div>
        <!-- Contextual Tooltip (Enhanced) -->
        <div
          class="absolute bottom-16 left-1/2 -translate-x-1/2 bg-gradient-to-r from-zinc-900 to-zinc-800 dark:from-zinc-100 dark:to-zinc-200 text-white dark:text-zinc-900 px-4 py-2 rounded-xl text-xs font-medium tracking-tight shadow-2xl opacity-0 hover:opacity-100 transition-opacity border border-zinc-700 dark:border-zinc-300"
        >
          Press
          <kbd
            class="bg-white/20 dark:bg-zinc-900/20 px-2 py-0.5 rounded font-bold"
            >V</kbd
          >
          for Select •
          <kbd
            class="bg-white/20 dark:bg-zinc-900/20 px-2 py-0.5 rounded font-bold"
            >R</kbd
          >
          for Rectangle
        </div>
      </div>
    </main>
    <!-- SideNavBar (Floating Toolbox): Unified Design -->
    <nav
      class="fixed left-4 top-1/2 -translate-y-1/2 w-14 rounded-2xl bg-zinc-50/90 dark:bg-zinc-900/90 backdrop-blur-2xl shadow-2xl shadow-zinc-200/50 dark:shadow-none flex flex-col items-center py-4 gap-6 z-50"
    >
      <!-- Select Tool (Active) -->
      <button
        class="relative flex flex-col items-center justify-center text-secondary dark:text-secondary before:absolute before:right-0 before:w-0.5 before:h-4 before:bg-secondary hover:text-zinc-900 dark:hover:text-zinc-100 transition-all hover:scale-110 active:scale-95 duration-200 group"
      >
        <span
          class="material-symbols-outlined"
          data-icon="near_me"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >near_me</span
        >
        <span
          class="font-['Inter'] text-[10px] font-medium uppercase tracking-tighter mt-1 opacity-0 group-hover:opacity-100 transition-opacity"
          >Select</span
        >
      </button>
      <!-- Rectangle Tool -->
      <button
        class="relative flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg p-2 transition-all hover:scale-110 active:scale-95 duration-200 group"
      >
        <span class="material-symbols-outlined text-lg" data-icon="rectangle"
          >rectangle</span
        >
        <span
          class="absolute left-full ml-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-xl"
          >Rectangle</span
        >
      </button>
      <!-- Circle Tool -->
      <button
        class="relative flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg p-2 transition-all hover:scale-110 active:scale-95 duration-200 group"
      >
        <span class="material-symbols-outlined text-lg" data-icon="circle"
          >circle</span
        >
        <span
          class="absolute left-full ml-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-xl"
          >Circle</span
        >
      </button>
      <!-- Line Tool -->
      <button
        class="relative flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-xl p-2.5 transition-all hover:scale-110 active:scale-95 duration-200 group"
      >
        <span
          class="material-symbols-outlined text-lg"
          data-icon="horizontal_rule"
          >horizontal_rule</span
        >
        <span
          class="absolute left-full ml-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-2.5 py-1 rounded-lg text-xs font-semibold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-xl"
          >Line</span
        >
      </button>
      <!-- Color Palette -->
      <div class="flex flex-col items-center justify-center gap-1.5 pt-1">
        <div
          class="w-5 h-5 rounded-md bg-gradient-to-br from-blue-400 to-blue-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-red-400 to-red-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-green-400 to-green-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-orange-400 to-orange-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-purple-400 to-purple-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-pink-400 to-pink-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-zinc-400 to-zinc-600 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
        <div
          class="w-6 h-6 rounded-lg bg-gradient-to-br from-zinc-800 to-zinc-950 border-2 border-white dark:border-zinc-900 hover:scale-125 transition-transform cursor-pointer shadow-md"
        ></div>
      </div>
      <div
        class="w-8 h-[2px] bg-zinc-200 dark:bg-zinc-800 my-1 rounded-full"
      ></div>
      <!-- Delete Tool -->
      <button
        class="relative flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-error hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl p-2.5 transition-all hover:scale-110 active:scale-95 duration-200 group"
      >
        <span class="material-symbols-outlined text-xl" data-icon="delete"
          >delete</span
        >
        <span
          class="absolute left-full ml-3 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-xl"
          >Delete</span
        >
      </button>
    </nav>
    <!-- Enhanced Metadata Panel -->
    <div
      class="fixed bottom-4 right-4 flex items-center gap-3 text-xs font-medium bg-white/70 dark:bg-zinc-900/70 backdrop-blur-xl px-3 py-2 rounded-xl border border-zinc-200/50 dark:border-zinc-800/50 shadow-lg text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-all duration-300"
    >
      <div class="flex items-center gap-2">
        <span class="uppercase tracking-wider font-bold">Pos:</span>
        <span class="font-mono">1024, 768</span>
      </div>
      <div class="w-[1px] h-4 bg-zinc-300 dark:bg-zinc-700"></div>
      <div class="flex items-center gap-2">
        <span class="uppercase tracking-wider font-bold">Zoom:</span>
        <span class="font-mono">100%</span>
      </div>
      <div class="w-[1px] h-4 bg-zinc-300 dark:bg-zinc-700"></div>
      <div class="flex items-center gap-2">
        <span class="uppercase tracking-wider font-bold">Grid:</span>
        <span class="font-mono">Active</span>
      </div>
    </div>
  </body>
</html>
